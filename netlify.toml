[build]
  publish = "."
  command = ""

# HTML: πάντα φρέσκο. Assets: μακρύ cache ΜΟΝΟ γιατί τα URLs έχουν ?v= έκδοση.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Το παλιό netlify.app πάει μόνιμα στο domain.
[[redirects]]
  from = "https://istoselidesai.netlify.app/*"
  to = "https://istoselides.ai/:splat"
  status = 301
  force = true
